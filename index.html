    <!-- Shopee Affiliate — klik button buka tab baru (rotasi acak, maks 3x/sesi).
         Aturan Fahmi 25 Nov 2026: semua button di semua halaman KECUALI navbar
         (header + drawer, data-shopee-exclude di Navbar.tsx) dan donasi
         (tombol kopi + popup, data-shopee-exclude di DonateWidget.tsx).
         Counter per sesi di sessionStorage (+ fallback memori bila storage
         tidak tersedia); rotasi acak 14 link, tanpa ulang link yang sama
         berturut-turut. Klik asli button TIDAK dicegah — hanya menambah tab. -->
    <script>
    (function () {
      var LINKS = [
        'https://s.shopee.co.id/AKcQ4OkOhc',
        'https://s.shopee.co.id/4Ved7fCRJb',
        'https://s.shopee.co.id/50atiZaa8p',
        'https://s.shopee.co.id/2VtYjxShLj',
        'https://s.shopee.co.id/2La8XdQA6D',
        'https://s.shopee.co.id/1W11Y5T7T9',
        'https://s.shopee.co.id/6q2XtsM8zA',
        'https://s.shopee.co.id/9072Tq5MYA',
        'https://s.shopee.co.id/50atiSqGUX',
        'https://s.shopee.co.id/5LDk73d5v8',
        'https://s.shopee.co.id/9072Tm7s8N',
        'https://s.shopee.co.id/AAIzrtZF7X',
        'https://s.shopee.co.id/4B1mihe7qA',
        'https://s.shopee.co.id/5LDk6oaQIY',
      ];
      var MAX_PER_SESSION = 3;
      var COUNT_KEY = 'locago_shopee_clicks';
      var LAST_KEY = 'locago_shopee_last';
      var memCount = 0;
      var memLast = null;
      function getCount() {
        var stored = 0;
        try { stored = parseInt(sessionStorage.getItem(COUNT_KEY) || '0', 10) || 0; } catch (e) {}
        return Math.max(memCount, stored);
      }
      function bumpCount() {
        memCount = getCount() + 1;
        try { sessionStorage.setItem(COUNT_KEY, String(memCount)); } catch (e) {}
      }
      function pickLink() {
        var last = memLast;
        try { last = sessionStorage.getItem(LAST_KEY) || memLast; } catch (e) {}
        var pool = LINKS.filter(function (u) { return u !== last; });
        var url = pool[Math.floor(Math.random() * pool.length)];
        memLast = url;
        try { sessionStorage.setItem(LAST_KEY, url); } catch (e) {}
        return url;
      }
      document.addEventListener('click', function (ev) {
        try {
          if (getCount() >= MAX_PER_SESSION) return;
          var t = ev.target;
          if (!t || !t.closest) return;
          var el = t.closest('button, a, input[type="submit"], input[type="button"], [role="button"]');
          if (!el) return;
          if (el.closest('[data-shopee-exclude]')) return;
          /* window.open + 'noopener' SELALU mengembalikan null (by design,
             jadi return value TIDAK BOLEH dipakai untuk menghitung) — hitung
             tiap klik yang lolos filter, tab yang kebuka dihitung 1. */
          try { window.open(pickLink(), '_blank', 'noopener'); } catch (e) {}
          bumpCount();
        } catch (e) { /* jangan ganggu klik aslinya */ }
      }, true);
    })();
    </script>
